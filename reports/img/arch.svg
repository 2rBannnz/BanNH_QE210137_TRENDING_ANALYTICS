<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1e24"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#16324f;stroke-width:1.4;rx:8}
    .store{fill:#eaf2fa;stroke:#1d5c8c;stroke-width:1.6;rx:8}
    .ext{fill:#fff4e5;stroke:#c77c02;stroke-width:1.4;rx:8}
    .h{font-weight:600;fill:#16324f}
    .s{font-size:11px;fill:#4a4f57}
    .arrow{stroke:#1b1e24;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .lbl{font-size:11px;fill:#1b1e24}
    .dash{fill:none;stroke:#6b7078;stroke-dasharray:6 4;stroke-width:1.2;rx:10}
  </style>

  <!-- Bên ngoài -->
  <rect x="25" y="70" width="175" height="78" class="ext"/>
  <text x="112" y="100" text-anchor="middle" class="h">YouTube Data API v3</text>
  <text x="112" y="120" text-anchor="middle" class="s">videos / channels / playlistItems</text>
  <text x="112" y="136" text-anchor="middle" class="s">search · quota 10.000 unit/ngày</text>

  <rect x="25" y="430" width="175" height="100" class="ext"/>
  <text x="112" y="456" text-anchor="middle" class="h">Máy thành viên</text>
  <text x="112" y="476" text-anchor="middle" class="s">cùng code, REGION_CODE = JP / US</text>
  <text x="112" y="492" text-anchor="middle" class="s">crawler_id: duc, phat</text>
  <text x="112" y="512" text-anchor="middle" class="s">gửi thư mục raw/ dạng zip</text>

  <!-- Máy host -->
  <rect x="235" y="20" width="745" height="585" class="dash"/>
  <text x="250" y="42" class="h" font-size="14">Máy Windows của nhóm (host)</text>

  <rect x="255" y="60" width="445" height="96" class="box"/>
  <text x="477" y="84" text-anchor="middle" class="h">Python 3.11 (uv, .venv) — chạy trên host theo lịch</text>
  <text x="477" y="104" text-anchor="middle" class="s">src/ingestion/crawler.py --job …  →  ghi raw JSON vào MinIO</text>
  <text x="477" y="120" text-anchor="middle" class="s">src/processing/cleaner.py  →  đọc MinIO, chuẩn hoá, nạp PostgreSQL</text>
  <text x="477" y="136" text-anchor="middle" class="s">notebooks/1_Exploration.ipynb, 2_Modeling.ipynb (Jupyter)</text>

  <rect x="725" y="60" width="235" height="96" class="box"/>
  <text x="842" y="84" text-anchor="middle" class="h">Windows Task Scheduler</text>
  <text x="842" y="104" text-anchor="middle" class="s">\ADY201m\: 5 task crawl</text>
  <text x="842" y="120" text-anchor="middle" class="s">(mỗi 1–3 giờ, 2 lần/ngày, 14:30)</text>
  <text x="842" y="136" text-anchor="middle" class="s">+ "Nap DB" mỗi 3 giờ</text>

  <!-- Docker Compose -->
  <rect x="255" y="190" width="705" height="395" class="dash"/>
  <text x="270" y="212" class="h" font-size="14">Docker Compose (5 container)</text>

  <rect x="275" y="230" width="190" height="110" class="box"/>
  <text x="370" y="254" text-anchor="middle" class="h">app</text>
  <text x="370" y="272" text-anchor="middle" class="s">docker/app/Dockerfile</text>
  <text x="370" y="288" text-anchor="middle" class="s">python:3.11-slim</text>
  <text x="370" y="304" text-anchor="middle" class="s">crawler + loader trong Docker</text>
  <text x="370" y="320" text-anchor="middle" class="s">docker compose run --rm app</text>

  <rect x="500" y="230" width="210" height="110" class="store"/>
  <text x="605" y="254" text-anchor="middle" class="h">minio — Data Lake</text>
  <text x="605" y="272" text-anchor="middle" class="s">:9000 API · :9001 Console</text>
  <text x="605" y="288" text-anchor="middle" class="s">bucket youtube-raw</text>
  <text x="605" y="304" text-anchor="middle" class="s">raw/youtube/&lt;job&gt;/dt=…/*.json</text>
  <text x="605" y="320" text-anchor="middle" class="s">state/ · volume minio_data</text>

  <rect x="745" y="230" width="200" height="110" class="store"/>
  <text x="845" y="254" text-anchor="middle" class="h">postgres</text>
  <text x="845" y="272" text-anchor="middle" class="s">postgres:15-alpine · :5432</text>
  <text x="845" y="288" text-anchor="middle" class="s">youtube_trending_db</text>
  <text x="845" y="304" text-anchor="middle" class="s">9 bảng, 4 khoá ngoại, 6 view</text>
  <text x="845" y="320" text-anchor="middle" class="s">volume postgres_data</text>

  <rect x="275" y="400" width="190" height="76" class="box"/>
  <text x="370" y="424" text-anchor="middle" class="h">data/processed/</text>
  <text x="370" y="442" text-anchor="middle" class="s">CSV đóng băng v_video_features</text>
  <text x="370" y="458" text-anchor="middle" class="s">(01/11) cho EDA và mô hình</text>

  <rect x="500" y="400" width="210" height="76" class="box"/>
  <text x="605" y="424" text-anchor="middle" class="h">pgadmin</text>
  <text x="605" y="442" text-anchor="middle" class="s">dpage/pgadmin4 · :5050</text>
  <text x="605" y="458" text-anchor="middle" class="s">xem bảng, ERD, chạy checks.sql</text>

  <rect x="745" y="400" width="200" height="110" class="box"/>
  <text x="845" y="424" text-anchor="middle" class="h">rstudio</text>
  <text x="845" y="442" text-anchor="middle" class="s">rocker/rstudio · :8787</text>
  <text x="845" y="458" text-anchor="middle" class="s">mount ./ → /home/rstudio/project</text>
  <text x="845" y="474" text-anchor="middle" class="s">knit notebooks/3_EDA.Rmd</text>
  <text x="845" y="490" text-anchor="middle" class="s">→ 3_EDA.html</text>

  <text x="270" y="560" class="s">Mật khẩu chỉ trong .env (không commit). Trong mạng Docker gọi service theo tên (minio:9000, postgres:5432); trên host dùng localhost.</text>
  <text x="270" y="578" class="s">minio, postgres, pgadmin, rstudio: restart unless-stopped. Lịch tự động chỉ chạy khi máy đăng nhập Windows và Docker Desktop đang bật.</text>

  <!-- Mũi tên -->
  <path d="M200,109 L255,109" class="arrow"/>
  <path d="M725,100 L700,100" class="arrow"/>
  <text x="712" y="92" text-anchor="middle" class="lbl">gọi</text>
  <path d="M605,156 L605,230" class="arrow"/>
  <text x="612" y="180" class="lbl">raw JSON (envelope)</text>
  <path d="M560,230 L560,156" class="arrow" stroke-dasharray="3 3"/>
  <text x="552" y="180" text-anchor="end" class="lbl">loader đọc</text>
  <path d="M680,156 L845,230" class="arrow"/>
  <text x="775" y="178" class="lbl">upsert theo lô</text>
  <path d="M200,480 L230,480 L230,365 L560,365 L560,340" class="arrow"/>
  <text x="300" y="358" class="lbl">import_raw_zip (giữ nguyên byte)</text>
  <path d="M845,340 L845,400" class="arrow"/>
  <path d="M780,340 L780,438 L710,438" class="arrow"/>
  <path d="M757,340 L757,386 L400,386 L400,400" class="arrow"/>
  <text x="480" y="381" class="lbl">\copy v_video_features ra CSV</text>
  <path d="M370,476 L370,535 L845,535 L845,510" class="arrow" stroke-dasharray="3 3"/>
  <text x="560" y="529" class="lbl">CSV cho EDA (knit) và notebook mô hình</text>
</svg>
